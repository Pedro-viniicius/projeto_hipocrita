# Desenvolvimento local: `docker compose up` → http://localhost:8000
# Produção: `docker compose -f compose.yaml -f compose.prod.yaml up -d` (ver README).
name: paodecadadia

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paodecadadia}
      POSTGRES_USER: ${POSTGRES_USER:-paodecadadia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha-so-para-desenvolvimento}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    image: paodecadadia-web
    command: ["/app/docker/start-dev.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG:-true}
      DEMO_DATA: ${DEMO_DATA:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-paodecadadia}
      POSTGRES_USER: ${POSTGRES_USER:-paodecadadia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha-so-para-desenvolvimento}
      MEDIA_ROOT: /data/media
    # Só a própria máquina acessa (http://localhost:8000); nada fica exposto na rede.
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  media:
